# Cloudflare Tunnel de Núcleo -> Caddy 127.0.0.1:8081:
#   bynucleo.com (y www): web, API y admin · app.bynucleo.com: descarga del APK
#   dispositivos.bynucleo.com: los ESP32 (/mqtt va directo al WebSocket de Mosquitto).
# deploy/instalar.sh lo copia a /etc/cloudflared/config.yml si CLOUDFLARE_TUNEL está en el .env raíz;
# __TUNEL__ es el ID del túnel y sus credenciales van en /etc/cloudflared/<ID>.json (fuera de git).
# Las métricas locales (127.0.0.1:20241) las lee estadoServer.sh para contar las conexiones.
tunnel: __TUNEL__
credentials-file: /etc/cloudflared/__TUNEL__.json
metrics: 127.0.0.1:20241
no-autoupdate: true
ingress:
  - hostname: bynucleo.com
    service: http://127.0.0.1:8081
  - hostname: www.bynucleo.com
    service: http://127.0.0.1:8081
  - hostname: app.bynucleo.com
    service: http://127.0.0.1:8081
  - hostname: dispositivos.bynucleo.com
    path: ^/mqtt$
    service: http://127.0.0.1:51884
  - hostname: dispositivos.bynucleo.com
    service: http://127.0.0.1:8081
  - service: http_status:404
