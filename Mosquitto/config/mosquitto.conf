# Broker Eclipse Mosquitto 2.x de Núcleo: MQTT sobre TLS en el puerto 8883 y, para los
# dispositivos por internet, un listener interno 1883 al que solo llega Tailscale Funnel
# (8443), que es quien termina el TLS con el certificado público del servidor.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Interno: el contenedor lo publica solo en 127.0.0.1 (MQTT_INTERNO_PORT) y lo usa Funnel.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
