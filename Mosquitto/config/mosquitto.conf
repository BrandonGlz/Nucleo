# Broker Eclipse Mosquitto 2.x de Núcleo: MQTT sobre TLS en el puerto 8883 (red local) y, para
# los dispositivos por internet, MQTT dentro de WebSocket en un listener interno (9001) al que
# solo llega el túnel de Cloudflare (https://dispositivos.bynucleo.com/mqtt), que termina el TLS.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Interno: el contenedor lo publica solo en 127.0.0.1 (MQTT_WS_PORT) y lo usa cloudflared.
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
