# Dependabot: revisa cada semana las dependencias y abre PR hacia dev con las actualizaciones.
# Las alertas de vulnerabilidades (Dependabot alerts) se activan en Settings → Code security.
version: 2
updates:
  - package-ecosystem: pip
    directory: /BackEnd
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(backend)"

  - package-ecosystem: npm
    directory: /FrontEnd
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(web)"

  # La app sigue la versión del SDK de Expo: sus dependencias se actualizan con
  # `npx expo install --fix` al cambiar de SDK. Aquí solo parches de lo que no es de Expo.
  - package-ecosystem: npm
    directory: /Mobile
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native*"
      - dependency-name: "@react-native*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(mobile)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
