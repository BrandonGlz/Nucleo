<text x="633" y="910" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Ventilador</text>
<path d="M100 810 H170" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#flecha)"/>
<path d="M100 880 H170" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#flecha)"/>
<text x="95" y="850" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">aire</text>
<text x="95" y="865" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">ambiente</text>
<path d="M633 930 V975" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#flechaC)"/>
<text x="645" y="972" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">salida de calor (rejilla trasera)</text>
<text x="790" y="470" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Por qué está así</text>
<circle cx="800" cy="501" r="10" fill="#7c3aed"/>
<text x="800" y="505" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="820" y="505" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Cámara de sensores aparte</text>
<text x="820" y="524" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Pared y hueco térmico: el calor del ESP y</text>
<text x="820" y="541" font-size="12" font-weight="400" fill="#374151" text-anchor="start">de la batería no altera temperatura ni aire.</text>
<circle cx="800" cy="579" r="10" fill="#7c3aed"/>
<text x="800" y="583" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="820" y="583" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Ventilador solo en Energía</text>
<text x="820" y="602" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Saca el calor por atrás, lejos de las rejillas</text>
<text x="820" y="619" font-size="12" font-weight="400" fill="#374151" text-anchor="start">de los sensores (nunca sopla sobre ellos).</text>
<circle cx="800" cy="657" r="10" fill="#7c3aed"/>
<text x="800" y="661" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="820" y="661" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Todo lo que se mira, al frente</text>
<text x="820" y="680" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Pantalla, anillo RGB, LED de Wi-Fi y buzzer</text>
<text x="820" y="697" font-size="12" font-weight="400" fill="#374151" text-anchor="start">quedan sobre el ESP, con cables cortos.</text>
<circle cx="800" cy="735" r="10" fill="#7c3aed"/>
<text x="800" y="739" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="820" y="739" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Puertos abajo</text>
<text x="820" y="758" font-size="12" font-weight="400" fill="#374151" text-anchor="start">USB-C de carga, interruptor y microSD</text>
<text x="820" y="775" font-size="12" font-weight="400" fill="#374151" text-anchor="start">accesibles con el equipo en la pared.</text>
<circle cx="800" cy="813" r="10" fill="#7c3aed"/>
<text x="800" y="817" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="820" y="817" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Medidas aproximadas</text>
<text x="820" y="836" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Cuerpo ~110 × 80 × 40 mm + cámara ~30 mm.</text>
<text x="820" y="853" font-size="12" font-weight="400" fill="#374151" text-anchor="start">PLA o PETG; montaje en pared o de mesa.</text>
</svg>
