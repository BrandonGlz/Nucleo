name: nucleo

services:
  postgres:
    image: postgres:17-alpine
    container_name: nucleo_postgres
    mem_limit: ${POSTGRES_MEM_LIMIT:-384m}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nucleo_db}
      POSTGRES_USER: ${POSTGRES_USER:-nucleo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    container_name: nucleo_timescaledb
    mem_limit: ${IOT_MEM_LIMIT:-512m}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IOT_DB:-nucleo_iot}
      POSTGRES_USER: ${IOT_USER:-nucleo_iot}
      POSTGRES_PASSWORD: ${IOT_PASSWORD:?IOT_PASSWORD es obligatorio}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # timescaledb-tune ajusta shared_buffers a esta memoria (solo al crear el volumen).
      TS_TUNE_MEMORY: ${IOT_TUNE_MEMORY:-512MB}
      TZ: UTC
    ports:
      - "127.0.0.1:${IOT_PORT:-55433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nucleo_mosquitto
    mem_limit: ${MQTT_MEM_LIMIT:-64m}
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-8883}:8883"
      # WebSocket interno sin TLS, solo local: lo publica el túnel de Cloudflare con TLS público.
      - "127.0.0.1:${MQTT_WS_PORT:-51884}:9001"
    volumes:
      - ./Mosquitto/config:/mosquitto/config:ro
      - ./Mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data

  redis:
    image: redis:7-alpine
    container_name: nucleo_redis
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # IA local de Nico AI (solo en el servidor: docker compose --profile ia up -d ollama). El modelo
  # (qwen2.5:1.5b) cargado ocupa ~1.3 GB; el tope es 3 GB. Un solo modelo cargado para todo el
  # servidor, dos peticiones en paralelo y caché KV en q8_0 para que quepan con menos memoria. Lo usa el ESP32 puente de cada
  # dispositivo a través de Caddy (/puente-ia/, con su clave); ver apps/reportes/puente.py.
  ollama:
    image: ollama/ollama:0.40.16
    container_name: nucleo_ollama
    profiles: ["ia"]
    mem_limit: ${OLLAMA_MEM_LIMIT:-3g}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MAX_QUEUE: 8
      OLLAMA_CONTEXT_LENGTH: 1024
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
    name: nucleo_ollama_data
  postgres_data:
    name: nucleo_postgres_data
  timescale_data:
    name: nucleo_timescale_data
  mosquitto_data:
    name: nucleo_mosquitto_data
